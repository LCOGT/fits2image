name: Run tests

# Push is limited to master because a branch push and its open pull request would
# otherwise each run the whole matrix. Work on a branch is covered by its pull request.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        label: ['latest deps']
        pins: ['']
        include:
          # The oldest combination the suite is known to pass on. numpy 2 removed the
          # implicit 1-element-array to float conversion and Pillow 10 removed
          # FreeTypeFont.getsize, so both ends of the range need covering.
          - python-version: '3.10'
            label: 'oldest deps'
            pins: 'numpy==1.22.4 astropy==5.0.4 Pillow==8.4.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the DejaVu fonts used by the label tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
          if [ -n "${{ matrix.pins }}" ]; then pip install ${{ matrix.pins }}; fi

      - name: Show resolved versions
        run: python -c "import sys, numpy, astropy, PIL; print(sys.version); print('numpy', numpy.__version__, '| astropy', astropy.__version__, '| Pillow', PIL.__version__)"

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
